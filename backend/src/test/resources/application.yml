# Test profile — loaded automatically for @SpringBootTest integration tests.
# Uses the same environment variables as the main application.
# Requires a running PostgreSQL instance (see README "Running tests").

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:business_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    secret: test-jwt-secret-key-at-least-32-characters-long
    expiration-ms: 86400000
